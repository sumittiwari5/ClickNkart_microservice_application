server {
  listen 80;

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri /index.html;
  }

  # MICROSERVICE NOTE: the monolith had one "location /api/" block pointing
  # at a single backend. Now each business area is a different Service DNS
  # name inside the cluster, so nginx routes by URL path instead. Order
  # matters here - nginx picks the FIRST matching prefix, so the more
  # specific routes must come before the general ones.

  # Auth - user-service
  location /api/register {
    proxy_pass http://user-service:8081/api/register;
  }
  location /api/login {
    proxy_pass http://user-service:8081/api/login;
  }
  location /api/users {
    proxy_pass http://user-service:8081/api/users;
  }

  # Catalog - catalog-service
  location /api/products {
    proxy_pass http://catalog-service:8082/api/products;
  }
  location /api/categories {
    proxy_pass http://catalog-service:8082/api/categories;
  }
  location /api/search-products {
    proxy_pass http://catalog-service:8082/api/search-products;
  }

  # Cart / Orders / Payment - order-service
  location /api/carts {
    proxy_pass http://order-service:8083/api/carts;
  }
  location /api/orders {
    proxy_pass http://order-service:8083/api/orders;
  }
  location /api/orderDetails {
    proxy_pass http://order-service:8083/api/orderDetails;
  }
  location /api/create-order {
    proxy_pass http://order-service:8083/api/create-order;
  }
  location /api/verify {
    proxy_pass http://order-service:8083/api/verify;
  }
}
