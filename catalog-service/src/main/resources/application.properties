spring.application.name=catalog-service
server.port=8082

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:mysql-service}:3306/catalogdb
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD:rootroot}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.format_sql=true

server.error.include-message=always
spring.data.rest.base-path=/api

# Must match user-service's jwt.secret exactly, or every token will fail validation here.
jwt.secret=${JWT_SECRET:YhPCzFiJ5rYtjDgASrOBsUS9r05ZK8pR7bIbhVR7ZIs=}

origin=${CORS_ORIGIN:http://localhost}
