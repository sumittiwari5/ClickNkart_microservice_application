# WHY THIS IS SEPARATE FROM THE HPA CONFIG IN EACH HELM CHART:
# HPA and Cluster Autoscaler solve two DIFFERENT problems, and your spec
# is right to ask for both:
#   - HPA (in each service's helm chart) decides "how many POD replicas
#     should catalog-service have right now?"
#   - Cluster Autoscaler (this file) decides "do we have enough EC2 NODES
#     to actually SCHEDULE all those pods?"
# If HPA scales catalog-service to 10 replicas but there's no room left on
# the backend node group's current nodes, those extra pods sit Pending
# forever without this. Cluster Autoscaler watches for Pending pods
# specifically caused by insufficient resources, and only THEN launches a
# new EC2 node in the right node group - this is what "launch EC2 only
# when Pending pods exist, terminate when unused" from your spec means in
# practice.
#
# Install via:
#   helm repo add autoscaler https://kubernetes.github.io/autoscaler
#   helm install cluster-autoscaler autoscaler/cluster-autoscaler -f cluster-autoscaler-values.yaml

autoDiscovery:
  clusterName: clicknkart-eks

awsRegion: ap-south-1

# Runs on the backend node group (needs a home itself, but should never
# compete with app pods for the small frontend nodes or the single Jenkins node)
nodeSelector:
  role: backend
tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "backend"
    effect: "NoSchedule"

extraArgs:
  scale-down-unneeded-time: 10m # a node must be genuinely idle for 10 min before being terminated - avoids flapping (scale down, then immediately need to scale back up)
  skip-nodes-with-local-storage: false # don't terminate nodes with local storage (e.g. EBS volumes) - we don't use this, but if you did, you'd want to keep those nodes around
  balance-similar-node-groups: true # if you have multiple node groups with the same instance type, try to keep them balanced (e.g. if you have 2 backend node groups, don't fill one up while leaving the other empty)
  