# Routes exactly as specified: / -> frontend, /api/user -> user-service,
# /api/catalog -> catalog-service, /api/order -> order-service.
#
# NOTE this is a real change from the local docker-compose/basic-k8s
# version's nginx.conf routing (which matched on the app's OWN native
# paths like /api/login, /api/products). Making THIS routing scheme work
# means either (a) rewriting each service's @RequestMapping paths to be
# prefixed with /user, /catalog, /order respectively, or (b) using an
# nginx.ingress.kubernetes.io/rewrite-target annotation to strip the
# prefix before forwarding. Decide which approach before implementing
# this phase - it's a real design choice, not just YAML.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clicknkart-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: /$2 
spec:
  rules:
  - http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frontend-service
              port:
                number: 80
        - path: /api/user(/|$)(.*)
          pathType: ImplementationSpecific
          backend:
            service:
              name: user-service
              port:
                number: 8081
        - path: /api/catalog(/|$)(.*)
          pathType: ImplementationSpecific
          backend:
            service:
              name: catalog-service
              port:
                number: 8082
        - path: /api/order(/|$)(.*)
          pathType: ImplementationSpecific
          backend:
            service:
              name: order-service
              port:
                number: 8083
        