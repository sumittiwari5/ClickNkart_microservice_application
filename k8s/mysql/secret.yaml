# NEVER commit real passwords in plain text like this in a real project -
# this is fine for local learning only. In production, use a secret
# manager (AWS Secrets Manager, Sealed Secrets, External Secrets Operator)
# and inject it at deploy time instead of checking it into git.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: clickncart
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: rootroot
