apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: clickncart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: mysql-init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: mysql-data
          # A basic cluster starts with an emptyDir (data is lost if the
          # pod is rescheduled) - swap this for a PersistentVolumeClaim
          # once you're ready for durable storage.
          emptyDir: {}
        - name: mysql-init
          configMap:
            name: mysql-init
