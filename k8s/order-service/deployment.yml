apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-service
  namespace: clickncart

spec:
  replicas: 1

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
        - name: order-service
          image: sumittiwari05/clickncart-order-service:v1

          imagePullPolicy: Always

          ports:
            - containerPort: 8083

          env:
            - name: MYSQL_HOST
              value: mysql

            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD

            - name: CATALOG_SERVICE_URL
              value: http://catalog-service:8082