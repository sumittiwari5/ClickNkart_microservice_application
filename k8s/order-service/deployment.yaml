apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: clickncart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
            # Kubernetes Service DNS: <service-name>.<namespace>.svc.cluster.local,
            # shortened to just <service-name> when calling from the same namespace.
            - name: CATALOG_SERVICE_URL
              value: "http://catalog-service:8082"
