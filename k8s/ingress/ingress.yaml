# Requires an nginx ingress controller installed in the cluster
# (kind/minikube: `minikube addons enable ingress` or install ingress-nginx
# via Helm; EKS: install the ingress-nginx Helm chart, or use the AWS Load
# Balancer Controller + ALB Ingress instead, which is what you used on the
# original ClickNCart EKS/Fargate setup).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clickncart-ingress
  namespace: clickncart
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
