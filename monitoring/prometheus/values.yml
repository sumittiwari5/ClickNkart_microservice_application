# WHY THIS IS A VALUES FILE FOR THE "kube-prometheus-stack" HELM CHART,
# NOT HAND-WRITTEN PROMETHEUS MANIFESTS: Prometheus + Grafana + Alertmanager
# + all the RBAC/CRDs (ServiceMonitor, PrometheusRule) they need is
# genuinely hundreds of manifests. Every real team installs this via the
# community "kube-prometheus-stack" Helm chart rather than writing it from
# scratch - the value you add is in CONFIGURING it correctly for your
# workload (this file), not reinventing Prometheus's own deployment
# manifests. Install with:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm install monitoring prometheus-community/kube-prometheus-stack -f monitoring/prometheus/values.yaml

prometheus:
  prometheusSpec:
    retention: 15d
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits:   { cpu: 500m, memory: 1Gi }
    # This is what makes Prometheus automatically discover and scrape
    # YOUR 4 services, without you hand-editing a scrape_configs list
    # every time a service is added - it watches for ServiceMonitor
    # objects matching this label instead.
    serviceMonitorSelector:
      matchLabels:
        release: monitoring

grafana:
  adminPassword: "REPLACE_AT_INSTALL_TIME"   # pass via --set at helm install, never commit
  service:
    type: ClusterIP    # reached via Ingress, not exposed directly - see k8s ingress config
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: clickncart
          folder: ClickNCart
          type: file
          options:
            path: /var/lib/grafana/dashboards/clickncart
  dashboardsConfigMaps:
    clickncart: clickncart-dashboards   # see grafana/dashboards/ - loaded from a ConfigMap of the JSON files there

alertmanager:
  enabled: true
  # Alert routing (Slack/email/PagerDuty webhook) goes here once you have
  # a real destination - left unconfigured intentionally rather than
  # guessing a webhook URL you don't have yet.