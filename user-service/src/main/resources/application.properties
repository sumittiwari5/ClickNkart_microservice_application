spring.application.name=user-service
server.port=8081

# Each microservice gets its OWN logical database. In this "basic cluster"
# version they all still point at one shared MySQL server/pod (see k8s/mysql)
# to keep resource usage low while you're learning - but note this is
# already DB-per-service at the schema level, which is the important part.
# When you're ready to go further, give each service its own MySQL pod too.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:mysql-service}:3306/userdb
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD:rootroot}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.format_sql=true

server.error.include-message=always
spring.data.rest.base-path=/api

# Same secret must be set on catalog-service and order-service too -
# that's what lets a token minted here be trusted there.
jwt.secret=${JWT_SECRET:YhPCzFiJ5rYtjDgASrOBsUS9r05ZK8pR7bIbhVR7ZIs=}
jwt.issuer=clickncart

origin=${CORS_ORIGIN:http://localhost}

management.endpoints.web.exposure.include=health,info

management.endpoint.health.probes.enabled=true

management.health.livenessstate.enabled=true

management.health.readinessstate.enabled=true