spring.application.name=order-service
server.port=8083

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:mysql-service}:3306/orderdb
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD:rootroot}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.format_sql=true

server.error.include-message=always
spring.data.rest.base-path=/api

jwt.secret=${JWT_SECRET:YhPCzFiJ5rYtjDgASrOBsUS9r05ZK8pR7bIbhVR7ZIs=}

# Kubernetes Service DNS name for catalog-service - this is how one pod
# finds another inside the cluster, no IP addresses involved.
catalog.service.url=${CATALOG_SERVICE_URL:http://catalog-service:8082}

razorpay.key_id=${RAZORPAY_KEY_ID:rzp_test_SXLPyp2eitE0Px}
razorpay.key_secret=${RAZORPAY_KEY_SECRET:6w8f0gbfMZyNat6YH7FDFtUM}

origin=${CORS_ORIGIN:http://localhost}

management.endpoints.web.exposure.include=health,info

management.endpoint.health.probes.enabled=true

management.health.livenessstate.enabled=true

management.health.readinessstate.enabled=true