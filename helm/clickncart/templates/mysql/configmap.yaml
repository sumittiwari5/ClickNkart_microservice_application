apiVersion: v1
kind: ConfigMap

metadata:
  name: mysql-initdb-config
  namespace: {{ .Values.namespace }}

data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS {{ .Values.mysql.database.userdb }};
    CREATE DATABASE IF NOT EXISTS {{ .Values.mysql.database.catalogdb }};
    CREATE DATABASE IF NOT EXISTS {{ .Values.mysql.database.orderdb }};