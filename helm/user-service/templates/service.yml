# THIS is the actual Blue-Green switch. `selector.color` below is the ONE
# line that determines which Deployment's pods receive real traffic.
# Jenkins' deploy stage changes `activeColor` in values.yaml and re-runs
# `helm upgrade` - Kubernetes then instantly re-points this Service's
# endpoints to the other color's pods. No pods restart, no downtime
# window - it's just a label selector change.
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  selector:
    app: user-service
    version: "v{{ .Values.liveVersion }}"
  ports:
    - port: 8081
      targetPort: 8081