{{/*
Renders one Deployment for liveVersion (always), one for candidateVersion
(only mid-release), and one per entry in retiredVersions (zero or more).
Which versions exist as REAL Kubernetes objects is entirely driven by
which ones are declared here - clear a version from values.yaml (as the
Jenkinsfile/cleanup job do via --set) and Helm deletes the real object on
the next `helm upgrade`, with no manual kubectl delete anywhere.
*/}}

# --- Live version - always exactly one ---
{{ include "user-service.versionedDeployment" (dict
      "root" $
      "version" .Values.liveVersion
      "imageTag" (index .Values.imageTags (printf "v%v" .Values.liveVersion))
      "retiredAt" ""
   ) }}

{{- if .Values.candidateVersion }}
---
# --- Candidate version - only while a release is in progress ---
{{ include "user-service.versionedDeployment" (dict
      "root" $
      "version" .Values.candidateVersion
      "imageTag" (index .Values.imageTags (printf "v%v" .Values.candidateVersion))
      "retiredAt" ""
   ) }}
{{- end }}

{{- range .Values.retiredVersions }}
---
# --- Retired version - kept temporarily as a rollback safety margin ---
{{ include "user-service.versionedDeployment" (dict
      "root" $
      "version" .version
      "imageTag" (index $.Values.imageTags (printf "v%v" .version))
      "retiredAt" .retiredAt
   ) }}
{{- end }}
