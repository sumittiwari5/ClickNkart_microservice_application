# ============================================================================
# VERSIONED BLUE-GREEN MODEL - replaces the old activeColor: blue/green.
#
# Three roles, tracked here as plain values (no more fixed "-blue"/"-green"
# object names - see docs/PHASE_BLUEGREEN.md for the full reasoning):
#   liveVersion      - currently receiving 100% traffic. Always set.
#   candidateVersion - the new version being deployed/validated right now.
#                       Empty when no release is in progress.
#   retiredVersions   - a LIST of previous live versions kept temporarily as
#                       rollback safety margin. Can legitimately hold MORE
#                       THAN ONE entry if a new release goes out before the
#                       scheduled cleanup job has cleared an earlier one -
#                       that's expected and fine, not a bug (see the
#                       Jenkinsfile's rollback-window discussion).
# ============================================================================

image:
  repository: REPLACE_WITH_ECR_URL/clickncart/user-service

liveVersion: 1
candidateVersion: ~   # ~ is YAML for null/empty

# Every version's OWN image tag - kept as a map because liveVersion and
# candidateVersion (and any retiredVersions) can all be genuinely different
# image builds, existing simultaneously, during a release.
imageTags:
  v1: "1.0.1"

# Retired versions - each needs its OWN retirement timestamp, since they
# can retire at different times. The scheduled cleanup job
# (jenkins/CleanupJenkinsfile) reads `retiredAt` per entry to decide
# whether that specific version's bounded window has passed yet.
retiredVersions: []
# Example of what this looks like WHILE populated (do not uncomment - Helm
# writes this list via --set-json from the Jenkinsfile, not by hand-editing):
# retiredVersions:
#   - version: 2
#     retiredAt: "2026-08-15T10:00:00Z"

replicaCount: 2

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 768Mi

nodeSelector:
  role: backend
tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "backend"
    effect: "NoSchedule"

hpa:
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

env:
  MYSQL_HOST: "REPLACE_WITH_RDS_ENDPOINT"

secretName: user-service-secret
