# WHY THIS IS "stringData" IN THE TEMPLATE BUT NEVER PLAINTEXT IN
# values.yaml: Helm renders this template using values that, in a real
# pipeline, come from `--set` flags sourced from Jenkins Credentials or
# AWS Secrets Manager at deploy time - never committed to this repo. The
# values.yaml file only holds the SECRET'S NAME, not its contents. See
# docs/PHASE_SECRETS.md for exactly where each credential is meant to live.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretName }}
type: Opaque
stringData:
  MYSQL_HOST: {{ .Values.env.MYSQL_HOST | quote }}
  MYSQL_ROOT_PASSWORD: "REPLACE_AT_DEPLOY_TIME"
  JWT_SECRET: "REPLACE_AT_DEPLOY_TIME"