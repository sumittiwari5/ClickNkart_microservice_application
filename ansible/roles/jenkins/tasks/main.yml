---
- name: Install Java (Jenkins requirement)
  apt:
    name: openjdk-17-jre
    state: present
    update_cache: yes

- name: Add Jenkins apt key
  apt_key:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key
    state: present

- name: Add Jenkins apt repository
  apt_repository:
    repo: "deb https://pkg.jenkins.io/debian-stable binary/"
    state: present

- name: Install Jenkins
  apt:
    name: jenkins
    state: present
    update_cache: yes

- name: Ensure Jenkins is running and enabled on boot
  systemd:
    name: jenkins
    state: started
    enabled: yes

- name: Wait for Jenkins to fully start (initial setup wizard)
  wait_for:
    port: 8080
    delay: 10
    timeout: 120