---
# WHY ANSIBLE FOR THIS, NOT TERRAFORM: Terraform's job ends the moment the
# EC2 instance exists and is running. What SOFTWARE is installed on it,
# and how that software is configured, is configuration management's job
# - a fundamentally different, repeatable, idempotent kind of task
# (running this playbook twice in a row should change nothing the second
# time). That's exactly what Ansible is built for.

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install Docker prerequisites
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present

- name: Add Docker's official GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker apt repository
  apt_repository:
    repo: "deb [arch={{ ansible_architecture }}] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present

- name: Install Docker Engine
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Add jenkins user to docker group
  user:
    name: jenkins
    groups: docker
    append: yes
  # This is what lets Jenkins build/push Docker images without needing
  # root - the same reasoning as adding your own user to the docker group
  # on the EC2 instance earlier in this project.
  